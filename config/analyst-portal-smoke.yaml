# Smoke test — single power-user agent on Haiku, ~$0.40 cap. Validates the
# scan end-to-end before unleashing the full 5-agent run.
#
# Note: the supervisor and post-run reviewer require ANTHROPIC_API_KEY (they
# use the direct Anthropic SDK, not subscription auth). They are enabled by
# default; unset api_key_env or omit ANTHROPIC_API_KEY to skip them and run
# explorers only on subscription auth.

target:
  url: https://hq.dev.ip-house.com/
  allowed_hosts:
    - hq.dev.ip-house.com
    - ip-house-dev.uk.auth0.com
  auth:
    type: form
    login_url: https://hq.dev.ip-house.com/
    username_selector: 'input[name="username"]'
    password_selector: 'input[name="password"]'
    submit_selector: 'button[type="submit"]'
    success_url_pattern: '^https://hq\.dev\.ip-house\.com'

anthropic:
  api_key_env: ANTHROPIC_API_KEY
  default_model: claude-haiku-4-5-20251001

run:
  max_budget_usd: 0.5
  output_dir: ./runs

agents:
  - id: smoke-power-user
    profile: power-user
    model: claude-haiku-4-5-20251001
    # 0 = thinking disabled (fastest, but Haiku tunnels on the same flow).
    # 1024 = API minimum when thinking is on. Buys multi-step coherence at
    # ~2-5s/turn cost — agent stays in one module and completes flows.
    max_thinking_tokens: 1024
    credentials:
      username_env: ANALYST_PORTAL_USER
      password_env: ANALYST_PORTAL_PASS
    budget:
      max_minutes: 5
      max_turns: 250
      max_usd: 0.4
