# regress-harness — reference config (OWASP Juice Shop quickstart).
#
# This example targets a local Juice Shop instance — run it with:
#
#   docker run --rm -p 3000:3000 bkimminich/juice-shop
#   bun run scan config/example.yaml
#
# Output:   runs/<runId>/{findings.json, review.md, summary.md, journeys/}
#
# Why Juice Shop? It's deliberately broken in well-known ways, so a fresh
# clone can verify the harness end-to-end. The seeded admin account
# (admin@juice-sh.op / admin123) is the default — supply it in .env as
# JUICE_SHOP_USER / JUICE_SHOP_PASS. Compare findings against
# http://localhost:3050/#/score-board.
#
# Sections in this file are roughly ordered: REQUIRED on top, then optional /
# tunable. Commented-out blocks show defaults — uncomment to override.

target:
  url: http://localhost:3050/

  # Hosts agents may navigate to. Every entry MUST also appear in the
  # operator-controlled REGRESS_TRUSTED_HOSTS env var; the harness refuses
  # to start otherwise. Match the URL's host:port form for local targets.
  allowed_hosts:
    - localhost:3050

  auth:
    # 'form' = pre-run AI auth-agent (Haiku) navigates to the login URL,
    # dismisses banners, fills the form, and verifies success. The captured
    # storageState is then loaded by the crawler and every persona session.
    # 'none' = anonymous browsing only (no auth-agent runs).
    #
    # The auth-agent reads the page semantically — it doesn't need brittle
    # CSS selectors and handles GDPR banners, multi-step flows, and
    # framework-specific button quirks (e.g. Angular Material's <a class
    # ="cc-dismiss"> "Me want it!" cookie button on Juice Shop) without
    # configuration. Just supply credentials.
    type: form
    login_url: http://localhost:3050/#/login

    # ─── Anonymous-only browsing (uncomment to revert) ───────────────────
    # type: none

  # Default Playwright Chromium — Juice Shop has no bot-detection. Set true
  # for targets behind Cloudflare / DataDome / similar.
  stealth: false

anthropic:
  # Env var holding the API key (set in .env). The supervisor and post-run
  # reviewer require the API key path; subscription auth is not supported.
  api_key_env: ANTHROPIC_API_KEY

  # Default model for agents (overridable per-agent below).
  default_model: claude-haiku-4-5-20251001

# Always-on supervisor agent — watches all explorers, calls relogin_session
# on auth-walls, pause_agents on triangulated backend storms (≥2 agents
# simultaneously seeing 5xx), nudge_agent on stuck agents.
supervisor:
  enabled: true
  model: claude-sonnet-4-6
  max_minutes: 8
  max_usd: 0.5
  max_turns: 60

# Post-run reviewer — critic LLM classifies each finding (confirmed_bug /
# likely_bug / duplicate / environmental / not_a_bug) and writes review.md.
# critic-with-browser then re-checks confirmed/likely findings against the
# live app, downgrading any that don't reproduce.
review:
  enabled: true
  model: claude-sonnet-4-6
  batch_mode: inline                # 'inline' | 'auto' | 'force_batch'
  verify_with_browser: true
  verify_concurrency: 3

crawler:
  parallelism: 3                    # concurrent tabs during pre-run crawl

selector_cache:
  enabled: true                     # persistent locator cache for find_and_click

run:
  max_budget_usd: 6.00              # informational cap; per-agent budgets enforce
  output_dir: ./runs

memory:
  # Anthropic Memory tool — currently disabled. Re-enable once the in-process
  # client-side handler is wired (the SDK exposes the tool but we don't yet
  # service the read/write/delete commands).
  enabled: false

agents:
  # Built-in profiles: house, the-spanner, leeroy-jenkins, the-magpie, caine,
  # bobby-tables. Add your own under skills/personas/<slug>/. Each persona owns
  # a distinct bug-detection lens — see skills/personas/<slug>/SKILL.md for
  # the mandate.
  #
  # Per-agent fields:
  #   model               override anthropic.default_model
  #   max_thinking_tokens 0 = off (fastest); >=1024 = enabled (API floor).
  #                       Sonnet attacker/completionist want 2000+.
  #   planner_model       optional smarter model for one-shot plan calls
  #                       between chunks; the cheap executor follows the plan
  #   override_personality inline string to bypass the SKILL.md prose
  #   credentials         env-var names (values stay in .env)
  #   budget              per-agent caps (turns, USD, minutes)

  # Default Juice Shop credentials — `admin@juice-sh.op:admin123` is the seeded
  # admin from the demo fixtures. Add to your .env as JUICE_SHOP_USER and
  # JUICE_SHOP_PASS. Every agent shares ONE login (session-pool dedups by
  # credentials), so the actual Auth0/login form fills only once per run.

  - id: attacker
    profile: bobby-tables
    model: claude-sonnet-4-6
    max_thinking_tokens: 2000
    credentials:
      username_env: JUICE_SHOP_USER
      password_env: JUICE_SHOP_PASS
    budget:
      max_minutes: 15
      max_turns: 250
      max_usd: 2.00

  - id: house
    profile: house
    model: claude-haiku-4-5-20251001
    max_thinking_tokens: 1024
    credentials:
      username_env: JUICE_SHOP_USER
      password_env: JUICE_SHOP_PASS
    budget:
      max_minutes: 10
      max_turns: 250
      max_usd: 0.80

  - id: leeroy
    profile: leeroy-jenkins
    model: claude-haiku-4-5-20251001
    max_thinking_tokens: 1024
    credentials:
      username_env: JUICE_SHOP_USER
      password_env: JUICE_SHOP_PASS
    budget:
      max_minutes: 10
      max_turns: 250
      max_usd: 0.60

  - id: spanner
    profile: the-spanner
    model: claude-haiku-4-5-20251001
    max_thinking_tokens: 1024
    credentials:
      username_env: JUICE_SHOP_USER
      password_env: JUICE_SHOP_PASS
    budget:
      max_minutes: 10
      max_turns: 200
      max_usd: 0.60

  - id: magpie
    profile: the-magpie
    model: claude-haiku-4-5-20251001
    max_thinking_tokens: 1024
    credentials:
      username_env: JUICE_SHOP_USER
      password_env: JUICE_SHOP_PASS
    budget:
      max_minutes: 10
      max_turns: 200
      max_usd: 1.00

  - id: caine
    profile: caine
    model: claude-haiku-4-5-20251001
    max_thinking_tokens: 1024
    credentials:
      username_env: JUICE_SHOP_USER
      password_env: JUICE_SHOP_PASS
    budget:
      max_minutes: 10
      max_turns: 200
      max_usd: 0.80
