# regress-harness — reference config (OWASP Juice Shop quickstart).
#
# This example targets a local Juice Shop instance — run it with:
#
#   docker run --rm -p 3000:3000 bkimminich/juice-shop
#   bun run scan config/example.yaml
#
# Output:   runs/<runId>/{findings.json, review.md, summary.md, journeys/}
#
# Why Juice Shop? It's deliberately broken in well-known ways, so a fresh
# clone can verify the harness end-to-end without needing real credentials
# or a target portal. Compare findings against http://localhost:3000/#/score-board.
#
# Sections in this file are roughly ordered: REQUIRED on top, then optional /
# tunable. Commented-out blocks show defaults — uncomment to override.

target:
  url: http://localhost:3000/

  # Hosts agents may navigate to. Every entry MUST also appear in the
  # operator-controlled REGRESS_TRUSTED_HOSTS env var; the harness refuses
  # to start otherwise. Match the URL's host:port form for local targets.
  allowed_hosts:
    - localhost:3000

  auth:
    # 'none' (public site, OR supply pre-built storage_state_path) | 'form'
    # (orchestrator fills the login form). Juice Shop's interesting bugs all
    # reproduce against unauthenticated routes too — start with 'none' and
    # layer in registered credentials later.
    type: none

    # ─── Form auth (uncomment when targeting a real portal) ──────────────
    # type: form
    # login_url: https://your-app.example.com/login
    # username_selector: 'input[name="username"]'
    # password_selector: 'input[name="password"]'
    # submit_selector: 'button[type="submit"]'
    # success_url_pattern: '^https://your-app\.example\.com/dashboard'
    # # Optional: pre-built storage state from `bunx playwright codegen`
    # # storage_state_path: ./fixtures/your-app-session.json

  # Default Playwright Chromium — Juice Shop has no bot-detection. Set true
  # for targets behind Cloudflare / DataDome / similar.
  stealth: false

anthropic:
  # Env var holding the API key (set in .env). The supervisor and post-run
  # reviewer require the API key path; subscription auth is not supported.
  api_key_env: ANTHROPIC_API_KEY

  # Default model for agents (overridable per-agent below).
  default_model: claude-haiku-4-5-20251001

# Always-on supervisor agent — watches all explorers, calls relogin_session
# on auth-walls, pause_agents on triangulated backend storms (≥2 agents
# simultaneously seeing 5xx), nudge_agent on stuck agents.
supervisor:
  enabled: true
  model: claude-sonnet-4-6
  max_minutes: 8
  max_usd: 0.5
  max_turns: 60

# Post-run reviewer — critic LLM classifies each finding (confirmed_bug /
# likely_bug / duplicate / environmental / not_a_bug) and writes review.md.
# critic-with-browser then re-checks confirmed/likely findings against the
# live app, downgrading any that don't reproduce.
review:
  enabled: true
  model: claude-sonnet-4-6
  batch_mode: inline                # 'inline' | 'auto' | 'force_batch'
  verify_with_browser: true
  verify_concurrency: 3

crawler:
  parallelism: 3                    # concurrent tabs during pre-run crawl

selector_cache:
  enabled: true                     # persistent locator cache for find_and_click

run:
  max_budget_usd: 3.00              # informational cap; per-agent budgets enforce
  output_dir: ./runs

memory:
  # Anthropic Memory tool — currently disabled. Re-enable once the in-process
  # client-side handler is wired (the SDK exposes the tool but we don't yet
  # service the read/write/delete commands).
  enabled: false

agents:
  # Built-in profiles: power-user, chaos-clicker, confused-newcomer,
  # completionist, insider-attacker. Add your own under skills/personas/<slug>/.
  #
  # Per-agent fields:
  #   model               override anthropic.default_model
  #   max_thinking_tokens 0 = off (fastest); >=1024 = enabled (API floor).
  #                       Sonnet attacker/completionist want 2000+.
  #   planner_model       optional smarter model for one-shot plan calls
  #                       between chunks; the cheap executor follows the plan
  #   override_personality inline string to bypass the SKILL.md prose
  #   credentials         env-var names (values stay in .env)
  #   budget              per-agent caps (turns, USD, minutes)

  - id: attacker
    profile: insider-attacker
    model: claude-sonnet-4-6
    max_thinking_tokens: 2000
    budget:
      max_minutes: 6
      max_turns: 120
      max_usd: 0.80

  - id: power-user
    profile: power-user
    model: claude-haiku-4-5-20251001
    max_thinking_tokens: 1024
    budget:
      max_minutes: 5
      max_turns: 200
      max_usd: 0.50

  - id: chaos
    profile: chaos-clicker
    model: claude-haiku-4-5-20251001
    max_thinking_tokens: 1024
    budget:
      max_minutes: 5
      max_turns: 200
      max_usd: 0.40

  - id: completionist
    profile: completionist
    model: claude-sonnet-4-6
    max_thinking_tokens: 1500
    budget:
      max_minutes: 6
      max_turns: 200
      max_usd: 0.80

  # ─── Orphan example: confused-newcomer (uncomment to add) ───────────────
  # First-time user who reads every label and panics at jargon. Catches UX
  # confusion an experienced user wouldn't notice.
  # - id: newcomer
  #   profile: confused-newcomer
  #   model: claude-haiku-4-5-20251001
  #   max_thinking_tokens: 1024
  #   budget:
  #     max_minutes: 5
  #     max_turns: 200
  #     max_usd: 0.40

  # ─── Authenticated example (uncomment when target.auth.type is 'form') ──
  # Per-agent credentials — values come from .env via the env-var names below.
  # - id: power-user-authed
  #   profile: power-user
  #   model: claude-haiku-4-5-20251001
  #   max_thinking_tokens: 1024
  #   credentials:
  #     username_env: PORTAL_USER
  #     password_env: PORTAL_PASS
  #   budget:
  #     max_minutes: 5
  #     max_turns: 200
  #     max_usd: 0.50
