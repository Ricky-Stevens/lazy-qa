# regress-harness — OWASP Juice Shop validation config (Phase 5).
#
# Run with: bun run scan config/juice-shop.yaml
# Prereq:   docker run --rm -p 3000:3000 bkimminich/juice-shop
# Validate: compare findings against http://localhost:3000/#/score-board
#
# Initial smoke run: type=none, single insider-attacker agent, low budget.
# Once we confirm the crawler / parser handle Angular hash-routes cleanly,
# layer in registered-user credentials + multi-persona scan.

target:
  url: http://localhost:3000/

  # Single-host scope. Must match REGRESS_TRUSTED_HOSTS exactly (the trusted
  # host check uses literal-string membership). `localhost:3000` is already
  # in the env on this machine.
  allowed_hosts:
    - localhost:3000

  auth:
    # Smoke run: no pre-login. Juice Shop's interesting bugs (XSS, IDOR,
    # broken access control, security headers) all reproduce against
    # unauthenticated routes too. Auth comes in run #2.
    type: none

  # Default Playwright Chromium — Juice Shop has no bot-detection.
  stealth: false

anthropic:
  api_key_env: ANTHROPIC_API_KEY
  default_model: claude-haiku-4-5-20251001

supervisor:
  enabled: true
  model: claude-sonnet-4-6
  max_minutes: 8
  max_usd: 0.5
  max_turns: 60

review:
  enabled: true
  model: claude-sonnet-4-6
  batch_mode: inline             # inline so we get the report immediately
  verify_with_browser: true       # exercise the new critic-with-browser
  verify_concurrency: 3

crawler:
  parallelism: 3                  # Juice Shop is small; this is just to exercise the parallel path

selector_cache:
  enabled: true

run:
  max_budget_usd: 1.50            # tight cap for the smoke run
  output_dir: ./runs

memory:
  # Disabled for Phase 5 — the harness advertises the memory_20250818
  # server tool but has no client-side handler, so the agent's first
  # `memory` call returns "Unknown tool". Re-enable once memory dispatch
  # is wired (separate work).
  enabled: false

agents:
  # Smoke run: ONE agent first. Verify the crawler and parser handle
  # Juice Shop's Angular hash-routes (#/login, #/search?q=...) before
  # spending budget on a multi-persona swarm.
  #
  # Auth.type=none means credentials are optional — but passing them in is
  # harmless; agents may still register/login mid-run via the UI.
  - id: attacker-smoke
    profile: insider-attacker
    model: claude-sonnet-4-6
    max_thinking_tokens: 2000
    budget:
      max_minutes: 5
      max_turns: 80
      max_usd: 0.50

  # Uncomment after the smoke run looks healthy. The full multi-persona
  # scan exercises functional + security paths together.
  #
  # - id: power-user
  #   profile: power-user
  #   model: claude-haiku-4-5-20251001
  #   max_thinking_tokens: 1024
  #   budget:
  #     max_minutes: 5
  #     max_turns: 200
  #     max_usd: 0.40
  #
  # - id: chaos
  #   profile: chaos-clicker
  #   model: claude-haiku-4-5-20251001
  #   max_thinking_tokens: 1024
  #   budget:
  #     max_minutes: 5
  #     max_turns: 200
  #     max_usd: 0.30
  #
  # - id: completionist
  #   profile: completionist
  #   model: claude-sonnet-4-6
  #   max_thinking_tokens: 1500
  #   budget:
  #     max_minutes: 5
  #     max_turns: 200
  #     max_usd: 0.60
